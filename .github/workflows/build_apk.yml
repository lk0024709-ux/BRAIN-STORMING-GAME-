name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:
    branches:
      - main
      - master

# A newer push to the same branch supersedes the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so every run resolves the same toolchain. Bump these deliberately.
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # The hosted Ubuntu images already ship a full Android SDK (cmdline-tools,
      # platforms;android-36, build-tools;36.0.0, platform-tools), so instead of
      # pulling a second copy of the command line tools we accept the licences and
      # make sure the packages this project compiles against are present. AGP can
      # then download anything else it needs on its own.
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -path '*/bin/*' 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "${sdkmanager}" ]]; then
            echo "::error::No sdkmanager found under ${sdk_root}/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: ${sdkmanager}"

          # `yes` dies of SIGPIPE once sdkmanager stops reading, so its status is
          # ignored on purpose. The install below is the real licence gate: it
          # fails hard if anything is still unaccepted.
          yes | "${sdkmanager}" --licenses > /dev/null || true
          "${sdkmanager}" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

          {
            echo "ANDROID_HOME=${sdk_root}"
            echo "ANDROID_SDK_ROOT=${sdk_root}"
          } >> "${GITHUB_ENV}"
          {
            echo "$(dirname "${sdkmanager}")"
            echo "${sdk_root}/platform-tools"
          } >> "${GITHUB_PATH}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        shell: bash
        run: flutter pub get 2>&1 | tee "${RUNNER_TEMP}/pub-get.log"

      - name: Run Analyzer
        shell: bash
        run: flutter analyze --no-fatal-infos 2>&1 | tee "${RUNNER_TEMP}/analyze.log"

      - name: Run Tests
        shell: bash
        run: flutter test 2>&1 | tee "${RUNNER_TEMP}/test.log"

      # Conditionally skip the heavy APK build on PRs to save CI minutes
      - name: Build Release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: flutter build apk --release 2>&1 | tee "${RUNNER_TEMP}/build-apk.log"

      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: brainspeed-iq-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      # TEMP-DEBUG: mirror the interesting lines of a failed step into check
      # annotations, which stay readable through the API.
      - name: Surface failure details
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          interesting='FAILURE:|What went wrong|Execution failed for task|\* Where|\* Try|Caused by:|error •|warning •|Some tests failed|\[E\]|Could not|No such|not accepted|Failed to'
          for log in "${RUNNER_TEMP}"/*.log; do
            grep -qE "${interesting}" "${log}" || continue
            name="$(basename "${log}" .log)"
            echo "::group::Failure summary for ${name}"
            grep -nE "${interesting}" "${log}" | cut -c1-240 | tail -n 60
            echo "::endgroup::"
            {
              grep -E "${interesting}" "${log}" | head -n 20
              echo "--- last lines ---"
              tail -n 10 "${log}"
            } | grep -vE 'LintDriver|BuildOperationRunner|ThreadPoolExecutor|WorkerServer' \
              | head -n 25 \
              | cut -c1-240 \
              | sed -e 's/%/%25/g' -e 's/\r//g' -e "s|^|::error title=${name}::|"
          done
