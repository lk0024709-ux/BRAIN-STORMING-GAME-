<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171b20">
<title>Building Lab · Textured Assets</title>
<script type="module" src="vendor/model-viewer.min.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#171b20;color:#edf0ed}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:40px 22px}header{border-bottom:1px solid #3b4248;padding-bottom:26px;margin-bottom:30px}.eyebrow{color:#b9d18c;text-transform:uppercase;letter-spacing:.2em;font-size:12px}h1{font-size:clamp(32px,6vw,56px);letter-spacing:-.045em;margin:12px 0}header p{color:#aeb7c0;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{background:#22282e;border:1px solid #3b4248;border-radius:16px;overflow:hidden}model-viewer{display:block;width:100%;height:360px;background:radial-gradient(ellipse at center,#e2e3df,#aeb4b4);touch-action:pan-y}.info{padding:22px}h2{margin:0 0 10px;font-size:23px}.meta{font-size:13px;color:#b9d18c}.description{color:#b8c0c7;font-size:14px;line-height:1.6}a{color:#d8e8bc;text-underline-offset:4px}.status{font-size:12px;color:#adb8c3;margin-bottom:12px}footer{margin-top:32px;color:#adb8c3;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}model-viewer{height:320px}main{padding:28px 16px}}
</style>
</head>
<body><main>
<header><span class="eyebrow">Building Lab / Asset collection 01</span><h1>Built for a closer look.</h1><p>Four real-scale buildings. AI-generated surface textures, packed into every model.<br>Drag to orbit · Pinch to zoom · Scroll to explore</p></header>
<section class="grid" id="buildings" aria-label="Interactive building models"></section>
<noscript>Enable JavaScript to view the four interactive buildings.</noscript>
<footer>Meters · Ground-centered origins · Embedded textures · Buildings only</footer>
</main>
<script type="module">
const buildings = [
 {id:'garage',name:'Garage',size:'10 × 8 × 4 m',surface:'Concrete',description:'Flat-roof concrete shell with a 4 × 3 m garage opening.'},
 {id:'sniper_tower',name:'Sniper tower',size:'4 × 4 × 10 m',surface:'Wood',description:'Four timber pillars, an 8 m platform, railings and a compact roof.'},
 {id:'house_small',name:'Small house',size:'6 × 6 × 3.5 m',surface:'Brick + wood',description:'Brick walls, a slanted wooden roof, one door and two window openings.'},
 {id:'warehouse',name:'Warehouse',size:'15 × 10 × 6 m',surface:'Corrugated metal',description:'Flat-roof metal warehouse with a 5 × 4.5 m loading entrance and sliding doors.'}
];
for (const b of buildings) {
 const card = document.createElement('article');
 card.innerHTML = `<model-viewer src="models/buildings/${b.id}.glb" alt="Textured ${b.name}, ${b.size}" camera-controls camera-orbit="-30deg 70deg auto" environment-image="neutral" shadow-intensity="1" exposure="1" loading="lazy" interaction-prompt="auto" touch-action="pan-y"></model-viewer><div class="info"><p class="meta">${b.size} · ${b.surface}</p><h2>${b.name}</h2><p class="description">${b.description}</p><p class="status" role="status">Loading 3D model…</p><a href="models/buildings/${b.id}.glb" download>Download GLB ↗</a></div>`;
 const viewer=card.querySelector('model-viewer'), status=card.querySelector('.status');
 viewer.addEventListener('load',()=>status.textContent='Ready · Drag to explore');
 viewer.addEventListener('error',()=>status.textContent='Could not load the model. Please reload or download the GLB.');
 document.querySelector('#buildings').append(card);
}
</script>
</body></html>
